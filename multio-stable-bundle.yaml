---
### Bundle

name    : multio-stable-bundle
version : 0.5.0
cmake   : >
    ECBUILD_2_COMPAT=ON
    ECBUILD_2_COMPAT_DEPRECATE=OFF
    INSTALL_LIB_DIR=lib
    ECBUILD_INSTALL_LIBRARY_HEADERS=OFF
    ECBUILD_INSTALL_FORTRAN_MODULES=OFF
    CMAKE_LINK_DEPENDS_NO_SHARED=ON

projects :

    - ecbuild :
        git     : ${BITBUCKET}/ecsdk/ecbuild
        version : 3.8.0
        bundle  : false

    - eccodes :
        git     : ${BITBUCKET}/eccodes/eccodes
        version : 2.31.2
        cmake   : >
            ENABLE_ECCODES_THREADS=ON
            ECCODES_ENABLE_NETCDF=OFF
            ECCODES_ENABLE_FORTRAN=ON
            ECCODES_ENABLE_MEMFS=ON
            ECCODES_INSTALL_EXTRA_TOOLS=ON
            ECCODES_ENABLE_PYTHON2=OFF
            ECCODES_ENABLE_AEC=ON

    - eckit :
        git     : git@github.com:ecmwf/eckit.git
        version : 1.24.4
        cmake   : >
            ECKIT_ENABLE_XXHASH=OFF
            ECKIT_ENABLE_VIENNACL=OFF
            ECKIT_ENABLE_EIGEN=OFF
            ECKIT_ENABLE_ARMADILLO=OFF
            ECKIT_ENABLE_CUDA=OFF
            ECKIT_ENABLE_SANDBOX=OFF
            ECKIT_ENABLE_MKL=OFF
            ECKIT_ENABLE_LAPACK=OFF
            ECKIT_ENABLE_MPI=ON

    - fckit :
        git     : ${BITBUCKET}/ecsdk/fckit
        version : 0.10.0
        require : eckit
        cmake   : FCKIT_ENABLE_FINAL=OFF

    - metkit :
        git     : ${BITBUCKET}/ecsdk/metkit
        version : 1.10.9
        require : eckit

    - fdb5 :
        git     : ${BITBUCKET}/mars/fdb5
        version : 5.11.23
        require : eckit metkit
        cmake   : >
            ENABLE_FDB_REMOTE=OFF
            ENABLE_FDB_BUILD_TOOLS=ON

    - atlas :
        git     : ${BITBUCKET}/atlas/atlas
        version : 0.33.0
        require : eckit
        cmake   : ENABLE_TESSELATION=OFF ENABLE_TRANS=OFF ENABLE_CLANG_TIDY=OFF ENABLE_GRIDTOOLS_STORAGE=OFF

    - atlas-orca:
        git     : git@github.com:ecmwf/atlas-orca.git
        version : 0.2.0
        require : atlas
        cmake   : >
            ENABLE_RETRIEVE_ORCA_DATA=ON
            ENABLE_INSTALL_ORCA_DATA=ON

    - mir :
        git     : git@github.com:ecmwf/mir.git
        version : 1.17.2
        require : atlas

    - pgen :
        git     : ${BITBUCKET}/prodgen/pgen
        version : 1.13.8
        require : eckit metkit

    - multio :
        git     : ${BITBUCKET}/mars/multio
        version : 2.0.0
        cmake   : >
            ENABLE_LEGACY_IFSIO=ON
