name: 'rule-gg-wv-int-instant-surface-simple-deterministic'

tag: 'fdb-01'

filter:
  type: 'composed'
  operation: 'all'
  filters:
    - type: 'composed'
      operation: 'none'
      filters:
        - type: 'is-ensemble'

    - type: 'param'
      operation: 'match'
      values: [ '140098:140105', '140112:140129', '140207:140209', '140211:140212', '140214:140222', '140223:140239', '140244:140245' ]

    - type: 'levtype'
      operation: 'match'
      values: [ 'sfc' ]

    - type: 'repres'
      operation: 'match'
      values: [ 'gg' ]

    - type: 'packing'
      operation: 'match'
      value: 'grib-simple'

encoder:
  type: 'grib2'

  indicator-section:
    template-number: 0

  identification-section:
    template-number: 0
    origin-configurator:
      type: 'default'
      sub-centre: 0

    data-type-configurator:
      type: 'default'

    reference-time-configurator:
      type: 'default'

    tables-configurator:
      type: 'default'
      local-tables-version: 0

  local-use-section:
    template-number: 1

  grid-definition-section:
    template-number: 40

  product-definition-section:
    template-number: 0

    point-in-time-configurator:
      type: 'default'

    param-configurator:
      type: 'paramId'

    level-configurator:
      type: 'surface'

  data-representation-section:
    template-number: 0