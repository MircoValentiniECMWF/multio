name: 'rule-gg-ml-acclpp-hybrid-simple-deterministic'

tag: 'fdb-01'

filter:
  type: 'composed'
  operation: 'all'
  filters:
    - type: 'composed'
      operation: 'none'
      filters:
        - type: 'is-ensemble'

    - type: 'param'
      operation: 'match'
      values: [ '162100:162113' ]

    - type: 'levtype'
      operation: 'match'
      values: [ 'ml' ]

    - type: 'repres'
      operation: 'match'
      values: [ 'gg' ]

    - type: 'packing'
      operation: 'match'
      value: 'grib-simple'

encoder:
  type: 'grib2'

  indicator-section:
    template-number: 0

  identification-section:
    template-number: 0
    origin-configurator:
      type: 'default'
      sub-centre: 0

    data-type-configurator:
      type: 'default'

    reference-time-configurator:
      type: 'default'

    tables-configurator:
      type: 'default'
      local-tables-version: 0

  local-use-section:
    template-number: 1

  grid-definition-section:
    template-number: 40

  product-definition-section:
    template-number: 8

    time-statistics-configurator:
      type: 'since-last-post-processing-step'
      type-of-statistical-processing: 'accumul'
      encode-step-zero: false

    param-configurator:
      type: 'paramId'

    level-configurator:
      type: 'hybrid'

  data-representation-section:
    template-number: 0